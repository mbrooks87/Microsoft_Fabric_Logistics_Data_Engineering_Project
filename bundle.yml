# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║         WMS SQL-FIRST MEDALLION — DATABRICKS ASSET BUNDLES CONFIG          ║
# ║                            bundle.yml                                       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# This file defines the entire WMS pipeline as infrastructure-as-code.
# Deploy with:
#   databricks bundle deploy --target dev
#   databricks bundle deploy --target prod
#
# Validate with:
#   databricks bundle validate
#
# Run manually with:
#   databricks bundle run wms_pipeline --target dev

bundle:
  name: wms_sql_medallion

# ── Variables ─────────────────────────────────────────────────────────────────
variables:
  cluster_node_type:
    default: "Standard_DS3_v2"
    description: "Node type for job clusters"
  min_workers:
    default: 1
    description: "Minimum number of workers"
  max_workers:
    default: 2
    description: "Maximum number of workers"

# ── Targets (environments) ────────────────────────────────────────────────────
targets:

  # Development — runs on every push to a feature branch
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.DATABRICKS_HOST}
    variables:
      min_workers: 1
      max_workers: 2

  # Production — runs on merge to main branch only
  prod:
    mode: production
    workspace:
      host: ${var.DATABRICKS_HOST}
    variables:
      min_workers: 2
      max_workers: 4
    run_as:
      service_principal_name: ${var.SERVICE_PRINCIPAL}

# ── Resources ─────────────────────────────────────────────────────────────────
resources:

  # ── Job Cluster definition (shared across all tasks) ──────────────────────
  clusters:
    wms_job_cluster: &wms_cluster
      spark_version: "14.3.x-scala2.12"
      node_type_id: ${var.cluster_node_type}
      autoscale:
        min_workers: ${var.min_workers}
        max_workers: ${var.max_workers}
      spark_conf:
        spark.databricks.delta.preview.enabled: "true"
        spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
      azure_attributes:
        availability: "ON_DEMAND_AZURE"

  # ── Main pipeline job ──────────────────────────────────────────────────────
  jobs:
    wms_pipeline:
      name: "[${bundle.target}] WMS SQL Medallion Pipeline"
      description: "Full Bronze → Silver → Gold batch pipeline for WMS dataset"

      # Email alerts on failure
      email_notifications:
        on_failure:
          - ${var.ALERT_EMAIL}

      # Timeout for the entire job (90 minutes)
      timeout_seconds: 5400

      # Retry once on failure
      max_concurrent_runs: 1

      # Shared job cluster
      job_clusters:
        - job_cluster_key: wms_cluster
          new_cluster:
            <<: *wms_cluster

      tasks:

        # ── TASK 1: Bronze Ingestion ─────────────────────────────────────────
        - task_key: bronze_ingest
          description: "Ingest all 19 raw CSVs into Bronze Delta tables"
          job_cluster_key: wms_cluster
          notebook_task:
            notebook_path: ./notebooks/bronze/nb_bronze_ingest_sql
            base_parameters:
              raw_path: "dbfs:/FileStore/wms/raw/"
              bronze_schema: "bronze"
          timeout_seconds: 2700   # 45 minutes

        # ── TASK 2: Silver Transform ─────────────────────────────────────────
        - task_key: silver_transform
          description: "Deduplicate, type cast, and enrich Bronze into Silver"
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: wms_cluster
          notebook_task:
            notebook_path: ./notebooks/silver/nb_silver_transform_sql
            base_parameters:
              bronze_schema: "bronze"
              silver_schema: "silver"
          timeout_seconds: 3600   # 60 minutes

        # ── TASK 3: Gold Build ───────────────────────────────────────────────
        - task_key: gold_build
          description: "Build star schema facts, dims, and KPI marts in Gold"
          depends_on:
            - task_key: silver_transform
          job_cluster_key: wms_cluster
          notebook_task:
            notebook_path: ./notebooks/gold/nb_gold_build_sql
            base_parameters:
              silver_schema: "silver"
              gold_schema: "gold"
          timeout_seconds: 3600   # 60 minutes

        # ── TASK 4: Data Quality Validation ─────────────────────────────────
        - task_key: dq_validation
          description: "Run data quality checks across all Gold tables"
          depends_on:
            - task_key: gold_build
          job_cluster_key: wms_cluster
          notebook_task:
            notebook_path: ./notebooks/tests/nb_dq_validation
            base_parameters:
              gold_schema: "gold"
              fail_on_error: "true"
          timeout_seconds: 900    # 15 minutes

      # Daily schedule trigger (06:00 UTC)
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED

    # ── Streaming job (always-on, separate from batch pipeline) ─────────────
    wms_iot_stream:
      name: "[${bundle.target}] WMS IoT Streaming"
      description: "Continuous Delta readStream → 1-hour window → gold_kpi_iot_stream"

      email_notifications:
        on_failure:
          - ${var.ALERT_EMAIL}

      # Auto-restart on failure — streaming should always be running
      max_concurrent_runs: 1

      job_clusters:
        - job_cluster_key: stream_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: ${var.cluster_node_type}
            num_workers: 1
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"

      tasks:
        - task_key: iot_stream
          description: "IoT Delta stream with SQL tumbling window aggregation"
          job_cluster_key: stream_cluster
          notebook_task:
            notebook_path: ./notebooks/streaming/nb_iot_stream_sql
            base_parameters:
              checkpoint_path: "dbfs:/FileStore/wms/checkpoints/iot_stream"
              target_table: "gold.gold_kpi_iot_stream"
              trigger_interval: "5 minutes"
