# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║         WMS SQL-FIRST MEDALLION — FABRIC DEPLOYMENT CONFIG                 ║
# ║                            bundle.yml                                       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# This file defines the notebooks, pipeline order, and environment targets
# for the WMS medallion project on Microsoft Fabric.
#
# Deployment is handled by the fabric-cicd Python library via GitHub Actions.
# See .github/workflows/deploy.yml for the full CI/CD workflow.
#
# MANUAL DEPLOYMENT (without GitHub Actions):
#   pip install fabric-cicd
#   python -c "
#     from fabric_cicd import FabricWorkspace, publish_all_items
#     ws = FabricWorkspace(
#         workspace_id='<YOUR_WORKSPACE_ID>',
#         repository_directory='.',
#         item_type_in_scope=['Notebook']
#     )
#     publish_all_items(ws)
#   "
#
# WORKSPACE IDs:
#   Find your workspace ID in the Fabric URL:
#   https://app.fabric.microsoft.com/groups/<WORKSPACE_ID>/...

project:
  name: wms_sql_medallion
  platform: microsoft_fabric
  description: >
    WMS SQL-First Medallion Architecture — Bronze, Silver, Gold, and IoT Streaming
    pipeline built on Microsoft Fabric with Delta Lake and Power BI DirectLake.

# ── Environments ──────────────────────────────────────────────────────────────
environments:

  dev:
    workspace_id: "${FABRIC_WORKSPACE_ID_DEV}"
    description: "Development workspace — deploys on every push to main"
    lakehouse_name: "wms_lakehouse_dev"
    raw_files_path: "Files/raw/"
    checkpoint_path: "Files/checkpoints/iot_stream"

  prod:
    workspace_id: "${FABRIC_WORKSPACE_ID_PROD}"
    description: "Production workspace — manual deploy with approval gate"
    lakehouse_name: "wms_lakehouse_prod"
    raw_files_path: "Files/raw/"
    checkpoint_path: "Files/checkpoints/iot_stream"

# ── Notebooks ─────────────────────────────────────────────────────────────────
# Listed in execution order. fabric-cicd deploys all notebooks to the
# target Fabric workspace. Orchestration (run order) is handled by
# Fabric Data Factory — see pipeline section below.
notebooks:

  - name: nb_bronze_ingest_sql
    path: notebooks/bronze/nb_bronze_ingest_sql.py
    description: >
      Part 1 — Ingests all 19 raw CSVs into Bronze Delta tables via
      read_files() CTAS. PySpark: 3 lines (schema bootstrap only).

  - name: nb_silver_transform_sql
    path: notebooks/silver/nb_silver_transform_sql.py
    description: >
      Part 2 — Deduplicates and type-casts Bronze into 15 Silver Delta
      tables using ROW_NUMBER() CTEs. PySpark: 0 lines.
    depends_on:
      - nb_bronze_ingest_sql

  - name: nb_gold_build_sql
    path: notebooks/gold/nb_gold_build_sql.py
    description: >
      Part 3 — Builds star schema (4 dims, 5 facts, 3 KPI marts) in Gold.
      Runs OPTIMIZE + ZORDER + VACUUM in pure SQL. PySpark: 0 lines.
    depends_on:
      - nb_silver_transform_sql

  - name: nb_dq_validation
    path: notebooks/tests/nb_dq_validation.py
    description: >
      Data quality validation — row counts, business rules, freshness checks
      across all 12 Gold tables. Raises exception on failure to fail the pipeline.
    depends_on:
      - nb_gold_build_sql

  - name: nb_iot_stream_sql
    path: notebooks/streaming/nb_iot_stream_sql.py
    description: >
      Part 4 — Always-on streaming notebook. Reads bronze.raw_iot_events via
      Delta readStream, aggregates into 1-hour tumbling windows, writes to
      gold.gold_kpi_iot_stream. Run as a separate Fabric Notebook Job.
      NOT part of the daily batch pipeline.
    always_on: true

# ── Data Factory Pipeline ─────────────────────────────────────────────────────
# Wire these notebooks in Fabric Data Factory (pl_wms_medallion):
#
#   DAILY BATCH (06:00 UTC):
#   [nb_bronze_ingest_sql]
#         │ on success
#         ▼
#   [nb_silver_transform_sql]
#         │ on success
#         ▼
#   [nb_gold_build_sql]
#         │ on success
#         ▼
#   [nb_dq_validation]
#         │ on success
#         ▼
#   [Wait 5 min → Power BI semantic model refresh]
#
#   STREAMING (always-on separate job):
#   [nb_iot_stream_sql] → Run as Fabric Notebook Job with "Restart on failure"

pipeline:
  name: pl_wms_medallion
  schedule: "0 6 * * *"      # Daily at 06:00 UTC (cron format)
  timezone: UTC
  tasks:
    - notebook: nb_bronze_ingest_sql
      timeout_minutes: 45
    - notebook: nb_silver_transform_sql
      timeout_minutes: 60
      depends_on: nb_bronze_ingest_sql
    - notebook: nb_gold_build_sql
      timeout_minutes: 60
      depends_on: nb_silver_transform_sql
    - notebook: nb_dq_validation
      timeout_minutes: 15
      depends_on: nb_gold_build_sql

streaming_job:
  name: wms_iot_stream
  notebook: nb_iot_stream_sql
  restart_on_failure: true
  description: >
    Runs continuously alongside the daily batch pipeline.
    Checkpoint at Files/checkpoints/iot_stream handles resume on restart.
