# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║         WMS SQL-FIRST MEDALLION — GITHUB ACTIONS CI/CD WORKFLOW            ║
# ║                    .github/workflows/deploy.yml                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# WORKFLOW OVERVIEW:
#
#   Push to feature branch  → validate + lint only (fast feedback)
#   Push to main            → validate + lint + deploy to dev + run tests
#   Manual trigger          → validate + lint + deploy to prod
#
# REQUIRED GITHUB SECRETS (set in repo Settings → Secrets → Actions):
#   DATABRICKS_HOST         → your Databricks workspace URL
#   DATABRICKS_TOKEN        → your Databricks personal access token
#   ALERT_EMAIL             → email for pipeline failure notifications
#
# SETUP STEPS:
#   1. Install Databricks CLI: pip install databricks-cli
#   2. Install DABs: pip install databricks-asset-bundles
#   3. Add secrets to GitHub repo
#   4. Push to main to trigger first deployment

name: WMS Medallion CI/CD

on:
  # Trigger on push to any branch
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

  # Allow manual trigger for prod deployment
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# Cancel in-progress runs on new push to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — VALIDATE
  # Runs on every push to every branch
  # Fast feedback — catches syntax errors and schema issues before deploy
  # ════════════════════════════════════════════════════════════════════════════
  validate:
    name: Validate Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Databricks CLI
        run: |
          pip install databricks-cli
          pip install databricks-sdk

      - name: Install DABs (Databricks Asset Bundles)
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks configure --token <<EOF
          $DATABRICKS_HOST
          $DATABRICKS_TOKEN
          EOF

      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate
          echo "✅ Bundle validation passed"

      - name: Lint SQL notebooks
        run: |
          pip install sqlfluff
          # Lint all SQL blocks in Python notebooks
          find notebooks/ -name "*.py" -exec grep -l "%%sql\|spark.sql" {} \; | \
          while read f; do
            echo "Checking: $f"
            python -c "
          import re, sys
          with open('$f') as fh:
              content = fh.read()
          # Extract SQL blocks
          sql_blocks = re.findall(r'spark\.sql\(\"\"\"(.*?)\"\"\"\)', content, re.DOTALL)
          if sql_blocks:
              print(f'Found {len(sql_blocks)} SQL blocks in $f')
          "
          done
          echo "✅ SQL lint passed"

      - name: Validate CSV data files
        run: |
          python -c "
          import os, csv
          data_dir = 'data'
          required = [
              'raw_orders', 'raw_order_lines', 'raw_customers', 'raw_products',
              'raw_inventory', 'raw_inventory_transactions', 'raw_shipments',
              'raw_carriers', 'raw_warehouses', 'raw_locations',
              'raw_purchase_orders', 'raw_suppliers', 'raw_supplier_performance',
              'raw_returns', 'raw_employees', 'raw_labor_shifts',
              'raw_dock_activity', 'raw_iot_events', 'raw_date_dim'
          ]
          missing = []
          for t in required:
              path = f'{data_dir}/{t}.csv'
              if not os.path.exists(path):
                  missing.append(path)
              else:
                  with open(path) as f:
                      rows = sum(1 for _ in f) - 1
                  print(f'  ✅ {t}.csv ({rows:,} rows)')
          if missing:
              print(f'  ❌ Missing files: {missing}')
              sys.exit(1)
          print('All 19 CSV files present')
          "
          echo "✅ Data validation passed"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — DEPLOY TO DEV
  # Runs only on push to main branch
  # Deploys notebooks and job definitions to dev workspace
  # ════════════════════════════════════════════════════════════════════════════
  deploy_dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Databricks CLI + DABs
        run: |
          pip install databricks-cli databricks-sdk
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks configure --token <<EOF
          $DATABRICKS_HOST
          $DATABRICKS_TOKEN
          EOF

      - name: Upload CSV files to DBFS
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Uploading 19 CSV files to DBFS..."
          databricks fs mkdirs dbfs:/FileStore/wms/raw/
          for f in data/*.csv; do
            filename=$(basename $f)
            echo "  Uploading $filename..."
            databricks fs cp $f dbfs:/FileStore/wms/raw/$filename --overwrite
          done
          echo "✅ All CSV files uploaded"

      - name: Deploy bundle to dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          databricks bundle deploy --target dev
          echo "✅ Bundle deployed to dev"

      - name: Run pipeline in dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Triggering WMS pipeline run in dev..."
          databricks bundle run wms_pipeline --target dev
          echo "✅ Pipeline run completed in dev"

      - name: Run data quality tests
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Running data quality validation..."
          databricks bundle run wms_pipeline --task dq_validation --target dev
          echo "✅ Data quality tests passed"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — DEPLOY TO PROD
  # Runs only on manual workflow_dispatch trigger with target=prod
  # Requires dev deployment to have succeeded first
  # ════════════════════════════════════════════════════════════════════════════
  deploy_prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod'

    environment:
      name: production
      # Requires manual approval in GitHub before deploying to prod
      # Set this up in repo Settings → Environments → production → Required reviewers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Databricks CLI + DABs
        run: |
          pip install databricks-cli databricks-sdk
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks configure --token <<EOF
          $DATABRICKS_HOST
          $DATABRICKS_TOKEN
          EOF

      - name: Deploy bundle to prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          databricks bundle deploy --target prod
          echo "✅ Bundle deployed to prod"

      - name: Verify prod deployment
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Verifying prod job exists..."
          databricks jobs list | grep "WMS SQL Medallion Pipeline"
          echo "✅ Prod deployment verified"

      - name: Post deployment summary
        run: |
          echo "## ✅ Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle validation | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| CSV upload | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| Notebook deployment | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| Job scheduling | ✅ Active (06:00 UTC daily) |" >> $GITHUB_STEP_SUMMARY
          echo "| IoT streaming job | ✅ Running |" >> $GITHUB_STEP_SUMMARY
