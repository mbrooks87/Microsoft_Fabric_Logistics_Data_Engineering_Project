# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║         WMS SQL-FIRST MEDALLION — GITHUB ACTIONS CI/CD WORKFLOW            ║
# ║                    .github/workflows/deploy.yml                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# WORKFLOW OVERVIEW:
#
#   Push to feature branch  → validate CSV files + lint notebooks (fast feedback)
#   Push to main            → validate + deploy notebooks to dev Fabric workspace
#   Manual trigger          → validate + deploy to prod Fabric workspace
#
# HOW FABRIC CI/CD WORKS:
#   This workflow uses the official Microsoft fabric-cicd Python library to deploy
#   notebooks directly into Fabric workspaces via the Fabric REST API.
#   Authentication uses an Azure Service Principal (not a personal token).
#
# REQUIRED GITHUB SECRETS (Settings → Secrets → Actions):
#   AZURE_CLIENT_ID         → Service principal application (client) ID
#   AZURE_CLIENT_SECRET     → Service principal client secret
#   AZURE_TENANT_ID         → Your Microsoft Entra (Azure AD) tenant ID
#   FABRIC_WORKSPACE_ID_DEV → Fabric workspace GUID for dev environment
#   FABRIC_WORKSPACE_ID_PROD→ Fabric workspace GUID for prod environment
#
# HOW TO GET THESE VALUES:
#   Service Principal:
#     Azure Portal → Azure Active Directory → App registrations → New registration
#     → Add a client secret → note the client ID, secret, and tenant ID
#     → In Fabric: Workspace Settings → add the service principal as Contributor
#   Workspace ID:
#     Open your Fabric workspace in browser → copy the GUID from the URL
#     e.g. https://app.fabric.microsoft.com/groups/<WORKSPACE_ID>/...

name: WMS Medallion CI/CD — Microsoft Fabric

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# Cancel in-progress runs on new push to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — VALIDATE
  # Runs on every push to every branch — fast feedback before any deployment
  # ════════════════════════════════════════════════════════════════════════════
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install fabric-cicd

      - name: Validate all 19 CSV data files are present
        run: |
          python -c "
          import os, sys
          required = [
              'raw_orders', 'raw_order_lines', 'raw_customers', 'raw_products',
              'raw_inventory', 'raw_inventory_transactions', 'raw_shipments',
              'raw_carriers', 'raw_warehouses', 'raw_locations',
              'raw_purchase_orders', 'raw_suppliers', 'raw_supplier_performance',
              'raw_returns', 'raw_employees', 'raw_labor_shifts',
              'raw_dock_activity', 'raw_iot_events', 'raw_date_dim'
          ]
          missing = []
          for t in required:
              path = f'data/{t}.csv'
              if not os.path.exists(path):
                  missing.append(path)
              else:
                  with open(path) as f:
                      rows = sum(1 for _ in f) - 1
                  print(f'  OK  {t}.csv  ({rows:,} rows)')
          if missing:
              print(f'MISSING: {missing}')
              sys.exit(1)
          print('All 19 CSV files present and accounted for.')
          "

      - name: Validate notebooks are present
        run: |
          python -c "
          import os, sys
          required = [
              'notebooks/bronze/nb_bronze_ingest_sql.py',
              'notebooks/silver/nb_silver_transform_sql.py',
              'notebooks/gold/nb_gold_build_sql.py',
              'notebooks/streaming/nb_iot_stream_sql.py',
              'notebooks/tests/nb_dq_validation.py',
          ]
          missing = [f for f in required if not os.path.exists(f)]
          if missing:
              print(f'MISSING notebooks: {missing}')
              sys.exit(1)
          print('All notebooks present.')
          "

      - name: Check notebooks for obvious syntax errors
        run: |
          python -c "
          import ast, os, sys
          notebooks = [
              'notebooks/bronze/nb_bronze_ingest_sql.py',
              'notebooks/silver/nb_silver_transform_sql.py',
              'notebooks/gold/nb_gold_build_sql.py',
              'notebooks/streaming/nb_iot_stream_sql.py',
              'notebooks/tests/nb_dq_validation.py',
          ]
          errors = []
          for nb in notebooks:
              with open(nb) as f:
                  source = f.read()
              try:
                  ast.parse(source)
                  print(f'  OK  {nb}')
              except SyntaxError as e:
                  errors.append(f'{nb}: {e}')
                  print(f'  FAIL  {nb}: {e}')
          if errors:
              sys.exit(1)
          print('All notebooks passed syntax check.')
          "

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — DEPLOY TO DEV FABRIC WORKSPACE
  # Runs on push to main only
  # Uses fabric-cicd to deploy notebooks to the dev Fabric workspace
  # ════════════════════════════════════════════════════════════════════════════
  deploy_dev:
    name: Deploy to Dev (Fabric)
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fabric-cicd
        run: pip install fabric-cicd

      - name: Deploy notebooks to dev Fabric workspace
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID_DEV }}
        run: |
          python - << 'PYEOF'
          import os
          from fabric_cicd import FabricWorkspace, publish_all_items

          workspace = FabricWorkspace(
              workspace_id    = os.environ["FABRIC_WORKSPACE_ID"],
              repository_directory = ".",
              item_type_in_scope   = ["Notebook"],
          )

          print("Deploying notebooks to dev Fabric workspace...")
          publish_all_items(workspace)
          print("Deployment to dev complete.")
          PYEOF

      - name: Post deployment summary
        run: |
          echo "## Dev Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Notebook | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| nb_bronze_ingest_sql | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| nb_silver_transform_sql | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| nb_gold_build_sql | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| nb_iot_stream_sql | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| nb_dq_validation | Deployed |" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — DEPLOY TO PROD FABRIC WORKSPACE
  # Manual trigger only (workflow_dispatch with target=prod)
  # Requires GitHub Environment approval gate — set up in:
  #   Repo Settings → Environments → production → Required reviewers
  # ════════════════════════════════════════════════════════════════════════════
  deploy_prod:
    name: Deploy to Prod (Fabric)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod'

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fabric-cicd
        run: pip install fabric-cicd

      - name: Deploy notebooks to prod Fabric workspace
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID_PROD }}
        run: |
          python - << 'PYEOF'
          import os
          from fabric_cicd import FabricWorkspace, publish_all_items

          workspace = FabricWorkspace(
              workspace_id    = os.environ["FABRIC_WORKSPACE_ID"],
              repository_directory = ".",
              item_type_in_scope   = ["Notebook"],
          )

          print("Deploying notebooks to prod Fabric workspace...")
          publish_all_items(workspace)
          print("Deployment to prod complete.")
          PYEOF

      - name: Post deployment summary
        run: |
          echo "## Prod Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Notebook | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| nb_bronze_ingest_sql | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| nb_silver_transform_sql | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| nb_gold_build_sql | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| nb_iot_stream_sql | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| nb_dq_validation | Deployed |" >> $GITHUB_STEP_SUMMARY
